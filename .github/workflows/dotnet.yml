# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build solution

# Este workflow se ejecuta cuando alguien hace push o crea un pull request
# hacia la rama principal. La idea es verificar automáticamente que el proyecto
# sigue compilando y que las pruebas siguen pasando.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test
    # Usamos un runner Linux de GitHub Actions, que es suficiente para compilar
    # y probar una solución .NET.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1) Descarga el código fuente del repositorio para que el workflow pueda
      # trabajar con los archivos del proyecto.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Instala el SDK de .NET necesario para compilar la solución.
      # El proyecto usa .NET 10, por eso se configura la versión 10.0.x.
      - name: Setup .NET SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3) Restaura todos los paquetes NuGet y dependencias del proyecto antes
      # de compilar. Esto asegura que el entorno ya tenga todo lo necesario.
      - name: Restore dependencies
        run: dotnet restore

      # 4) Compila la solución en modo Release. El flag --no-restore evita que
      # vuelva a restaurar paquetes ya descargados y acelera la ejecución.
      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # 5) Ejecuta la suite de pruebas del proyecto. Si alguna prueba falla,
      # el workflow marcará el pipeline como fallido.
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # 6) Publica los resultados de pruebas en GitHub como un Check/Status,
      # para que los estudiantes puedan ver en una vista organizada si hubo
      # fallas o éxito en cada ejecución del pipeline.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
